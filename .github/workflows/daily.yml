name: 每日盤後更新
on:
  schedule:
    # 週一至週五 台北 (UTC+8) 14:00、15:00、16:30、18:00、21:00
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: daily, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch.py
      - name: Commit data
        run: |
          git config user.name "tw-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data snapshots
          if git diff --cached --quiet; then echo "資料無變動，略過 commit"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
